name: Supply Chain Gate Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml

      - name: Compile gate code
        run: python -m py_compile scripts/gate.py

      - name: Run unit tests
        run: python -m pytest -q tests/
