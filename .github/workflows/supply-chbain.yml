name: Supply Chain Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: supply-chain-demo
  REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read

jobs:
  pull-request-validation:
    name: Pull request validation (no publishing credentials)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml

      - name: Compile Python
        run: python -m py_compile scripts/*.py app/app.py

      - name: Test vulnerability gate
        run: python -m pytest -q tests/

      - name: Check shell scripts
        run: bash -n scripts/*.sh signing/verify.sh

      - name: Build container without publishing
        run: docker build --file build/Dockerfile --tag supply-chain-pr:${{ github.sha }} .

  secure-build:
    name: Secure container build and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable commit tag
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Display immutable image digest
        run: echo "Built image digest: ${{ steps.build.outputs.digest }}"

  generate-sbom:
    name: SBOM generation
    runs-on: ubuntu-latest
    needs: [secure-build]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM from immutable digest
        env:
          IMAGE_DIGEST: ${{ needs.secure-build.outputs.image-digest }}
        run: |
          mkdir -p sbom
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"
          syft "$IMAGE_REF" \
            --output cyclonedx-json=sbom/sbom.cyclonedx.json \
            --output spdx-json=sbom/sbom.spdx.json
          python3 - <<'PY'
          import json
          with open("sbom/sbom.cyclonedx.json", encoding="utf-8") as handle:
              data = json.load(handle)
          print(f"SBOM components: {len(data.get('components', []))}")
          PY

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  vulnerability-scan:
    name: Vulnerability scan and policy gate
    runs-on: ubuntu-latest
    needs: [generate-sbom]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Install gate dependencies
        run: python -m pip install pyyaml

      - name: Scan SBOM
        run: |
          mkdir -p scan-results
          grype sbom:sbom/sbom.cyclonedx.json \
            --output json \
            --file scan-results/grype-results.json

      - name: Apply severity and suppression policy
        run: python scripts/gate.py

      - name: Upload scan decision and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scan-results/

  sign-image:
    name: Sign and verify immutable image
    runs-on: ubuntu-latest
    needs: [secure-build, vulnerability-scan]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image digest
        env:
          IMAGE_DIGEST: ${{ needs.secure-build.outputs.image-digest }}
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes \
            --predicate sbom/sbom.cyclonedx.json \
            --type cyclonedx \
            "$IMAGE_REF"
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "$IMAGE_REF"

  admission-simulation:
    name: Admission control simulation
    runs-on: ubuntu-latest
    needs: [sign-image]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run admission simulation
        run: python scripts/admission_simulation.py
