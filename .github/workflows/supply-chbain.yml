name: Supply Chain Security Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: supply-chain-demo
  REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write
  id-token: write # Required for Cosign keyless signing

jobs:
  secure-build:
    name: Secure Container Build
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      full-image: ${{ steps.build.outputs.full-image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Display Image Digest
        run: |
          echo "[BUILD] Image digest: ${{ steps.build.outputs.digest }}"
          echo "[BUILD] Digest pinning prevents tag mutation attacks"

  generate-sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: [secure-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          mkdir -p sbom
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --output cyclonedx-json=sbom/sbom.cyclonedx.json \
            --output spdx-json=sbom/sbom.spdx.json

          echo "[SBOM] Components:"
          python3 - <<EOF
          import json
          with open("sbom/sbom.cyclonedx.json") as f:
              data = json.load(f)
          components = data.get("components", [])
          print(f" Total: {len(components)}")
          EOF

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Check SQLite Version
        run: |
         grep -i sqlite sbom/sbom.cyclonedx.json | head -20    

  vulnerability-scan:
    name: Vulnerability Scan and Gate
    runs-on: ubuntu-latest
    needs: [generate-sbom]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Scan SBOM
        run: |
          mkdir -p scan-results
          grype sbom:sbom/sbom.cyclonedx.json \
            --output json \
            --file scan-results/grype-results.json

          grype sbom:sbom/sbom.cyclonedx.json \
            --output table

      - name: Apply Severity Gate
        run: python3 scripts/gate.py

      - name: Upload Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scan-results/

  sign-image:
    name: Sign Image
    runs-on: ubuntu-latest
    needs: [vulnerability-scan]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign Image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          echo "[SIGN] Image signed with keyless OIDC"
          echo "[SIGN] Identity: GitHub Actions"
          echo "[SIGN] Transparency log: Rekor"

      - name: Attach SBOM Attestation
        run: |
          cosign attest --yes \
            --predicate sbom/sbom.cyclonedx.json \
            --type cyclonedx \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          echo "[SIGN] SBOM attached as attestation"

      - name: Verify Signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          echo "[VERIFY] Signature verification successful"

  admission-simulation:
    name: Admission Control Simulation
    runs-on: ubuntu-latest
    needs: [sign-image]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Admission Simulation
        run: python3 scripts/admission_simulation.py